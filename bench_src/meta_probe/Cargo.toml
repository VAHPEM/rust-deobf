[package]
name = "meta_probe"
version = "0.1.0"
edition = "2021"

# A Tier-3 metadata probe: pulls several real crates that leave rich panic/Location
# metadata, so recover_rust_meta's crate+version recovery can be scored against a
# non-trivial Cargo.lock. Benign: it only exercises the crates on constant inputs.
[dependencies]
regex = "1"
serde_json = "1"
url = "2"
base64 = "0.22"

[profile.release]
opt-level = 3
strip = false
