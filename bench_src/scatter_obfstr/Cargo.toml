[package]
name = "scatter_obfstr"
version = "0.1.0"
edition = "2021"

[dependencies]
obfstr = "0.4"

[profile.release]
strip = false
opt-level = 3

[profile.size-lto]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.speed-lto]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
