name: CI

on:
  push:
  pull_request:
  schedule:
    # weekly: a new stable rustc can change the decoder idioms the recoverers key on
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  selftest:
    # every test that needs no benchmark build: script self-tests, the committed fixtures
    # (Mach-O, lazy string encryption, VM detection/lifting, anti-emulation, deflattening,
    # devirtualization, expression simplification) and the unit tests of the front ends (recover,
    # soc_triage, llm_triage, recover_dynamic, ghidra_annotate, heldout scoring, build scripts).
    # The benchmark-build tests run in the benchmark job; test_32bit/test_formats build i686
    # targets themselves and are not part of this quick job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Unit + fixture tests (no benchmark build needed)
        run: >-
          python -m pytest tests -q -rs
          --ignore=tests/test_benchmark.py --ignore=tests/test_scatter.py
          --ignore=tests/test_obf.py --ignore=tests/test_libfuncs.py
          --ignore=tests/test_32bit.py --ignore=tests/test_formats.py

  native:
    # the same fast subset (`./scripts/check.sh full` -- its ignore list is the one
    # tests/test_docs_current.py keeps equal to the selftest job's) on native hosts other than
    # x86-64 Linux, so the toolkit itself is tested where it runs, not only on ubuntu-latest.
    # No benchmark build here (Windows only adds the GNU target for the tests' own small
    # fixtures). Committed benign fixtures only; the one test that executes a sample stays off
    # (RUST_DEOBF_DYNAMIC is not set).
    # windows-11-arm is a canary (continue-on-error) for native ARM64 Python: unicorn and
    # capstone<6 ship no win_arm64 wheels, so the canary builds the PINNED versions itself (its
    # steps before `pip install`): capstone from its sdist with the runner's MSVC ARM64 (vcvars
    # via msvc-dev-cmd), unicorn 2.1.4 from its sdist + upstream PR 2286 (see those steps).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
          - os: windows-latest
          - os: macos-latest        # ARM64
          - os: macos-15-intel      # x86-64
          - os: windows-11-arm
            canary: true
            arch: arm64             # native ARM64 Python, not x64 under emulation (that has wheels)
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.canary == true }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash               # check.sh is bash; Git Bash on the Windows runners
    env:
      PYTHON: python              # check.sh's interpreter; `python3` is not reliable on Windows
    steps:
      # Windows runners default to core.autocrlf=true; with no .gitattributes that checks out
      # check.sh (and the text fixtures) with CRLF and bash dies on `set -o pipefail\r` -- a
      # checkout artifact, not a toolkit result. Check out the bytes as committed.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}   # empty = the runner's native arch
      - name: Interpreter (the canary must be native ARM64 to mean anything)
        run: |
          python -c "import platform, sys, sysconfig; print(sys.version); print(platform.machine(), sysconfig.get_platform())"
          # the interpreter's own arch is sysconfig's platform: platform.machine() is the HOST CPU
          # (ARM64 even for an x64 python.exe on Windows-on-ARM, see CLAUDE.md)
          if [ "${{ matrix.canary }}" = "true" ]; then
            python -c "import sys, sysconfig; sys.exit(sysconfig.get_platform() != 'win-arm64')"
          fi
      # --- canary only: win_arm64 builds of the pinned capstone / unicorn ---------------------
      # Drop these steps once capstone 5.x and unicorn 2.x publish win_arm64 wheels on PyPI.
      - name: MSVC ARM64 environment (canary; capstone's sdist runs CMake + NMake, needs vcvars)
        if: matrix.canary == true
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      # unicorn 2.1.4 cannot run on Windows ARM64 as released: under MSVC its CMake assumes an
      # x86 host (-D__x86_64__, tcg/i386, an ml64 setjmp file), and every _WIN64 build installs an
      # x86-64 vectored-exception trampoline (a MinGW/clang build dies in the first uc_mem_map).
      # Upstream PR unicorn-engine/unicorn#2286 ("Add Windows ARM64 build support", open) fixes
      # both; its source hunks apply cleanly to the 2.1.4 sdist. The PR is fetched at a pinned
      # commit and checked by sha256 (GPL-2.0 source stays out of this Apache-2.0 repo), built
      # with MSVC ARM64, and the DLL goes into the sdist's prebuilt/ -> a local win_arm64 wheel.
      # requirements.txt and its pin are unchanged.
      - name: Cached unicorn win_arm64 wheel (canary)
        if: matrix.canary == true
        id: ucwheel
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/uc-wheel
          key: unicorn-2.1.4-pr2286-e45dd6e3c473371761684dd8e4f4e353c67cd6cb1b1febc26950e575dc089da6-win-arm64-v1
      - name: Build unicorn 2.1.4 + PR 2286 with MSVC ARM64 (canary, cache miss)
        if: matrix.canary == true && steps.ucwheel.outputs.cache-hit != 'true'
        env:
          UC_VER: "2.1.4"
          PR_BASE: 681bd329438b32f4efe8503e9b316f613a9a27ba   # unicorn dev, the PR's base
          PR_HEAD: a3f97aaf9ee98839fbdc4711df262411f1906343   # PR 2286 head commit
          PR_SHA256: e45dd6e3c473371761684dd8e4f4e353c67cd6cb1b1febc26950e575dc089da6
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/uc-build"; mkdir -p "$work" && cd "$work"
          curl -fsSL -o pr2286.diff "https://github.com/unicorn-engine/unicorn/compare/$PR_BASE...$PR_HEAD.diff"
          echo "$PR_SHA256  pr2286.diff" | sha256sum -c - || { echo "::error::PR 2286 diff sha256 mismatch"; exit 1; }
          python -m pip download --no-binary :all: --no-deps "unicorn==$UC_VER"
          tar -xzf "unicorn-$UC_VER.tar.gz"
          cd "unicorn-$UC_VER/src"
          # the PR also edits upstream's CI workflow, which the sdist does not carry
          git apply --exclude='.github/workflows/build-uc2.yml' --verbose "$work/pr2286.diff"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DUNICORN_BUILD_TESTS=ON
          cmake --build build
          # unicorn's own unit tests on the native build: a broken engine fails here, not later
          ctest --test-dir build --output-on-failure
          cp build/unicorn.dll ../prebuilt/unicorn.dll
          cd .. && python -m pip wheel --no-deps -w "$RUNNER_TEMP/uc-wheel" .
      - name: Install the unicorn win_arm64 wheel (canary)
        if: matrix.canary == true
        run: |
          set -euo pipefail
          ls "$RUNNER_TEMP"/uc-wheel
          python -m pip install "$RUNNER_TEMP"/uc-wheel/unicorn-2.1.4-*-win_arm64.whl
          python - <<'PY'
          from unicorn import Uc, UC_ARCH_X86, UC_MODE_64, UC_HOOK_CODE, __version__
          from unicorn.x86_const import UC_X86_REG_RAX
          code = bytes.fromhex("4831c048c7c1e80300004801c848ffc975f8")   # rax = sum(1..1000)
          uc = Uc(UC_ARCH_X86, UC_MODE_64); uc.mem_map(0x1000, 0x1000); uc.mem_write(0x1000, code)
          n = []
          uc.hook_add(UC_HOOK_CODE, lambda *a: n.append(1))
          uc.emu_start(0x1000, 0x1000 + len(code))
          assert uc.reg_read(UC_X86_REG_RAX) == 500500, uc.reg_read(UC_X86_REG_RAX)
          print("unicorn", __version__, "OK:", len(n), "hooked instructions")
          PY
      - run: python -m pip install -r requirements.txt pytest
      # Host-built test fixtures are pinned to the GNU ABI on Windows (tests/conftest.py:
      # CLANG_TARGET / RUSTC_TARGET): the default clang / rustc there target MSVC, which changes the
      # binary under test instead of the host. clang --target=x86_64-w64-mingw32 needs a MinGW-w64
      # sysroot (MSYS2 is preinstalled, not on PATH) and rustc the windows-gnu std.
      - name: GNU-target toolchain for host-built fixtures (Windows)
        if: runner.os == 'Windows' && matrix.canary != true
        shell: pwsh
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-gcc"
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          rustup target add x86_64-pc-windows-gnu
      - name: GNU-target toolchain check (Windows)
        if: runner.os == 'Windows' && matrix.canary != true
        run: |
          gcc -dumpmachine
          echo 'int main(void){return 0;}' > t.c
          clang --target=x86_64-w64-mingw32 t.c -o t.exe && ./t.exe && echo "clang mingw OK"
          echo 'fn main(){}' > t.rs
          rustc --target x86_64-pc-windows-gnu t.rs -o t2.exe && ./t2.exe && echo "rustc windows-gnu OK"
          rm -f t.c t.exe t.rs t2.exe
      - name: Fast subset (check.sh full) on a native host
        run: ./scripts/check.sh full

  packaging:
    # `pip install rust-deobf` must keep working: build both distributions (rust-deobf and
    # rust-deobf-premium), install the wheels into a fresh venv and run them from outside the
    # checkout -- --version, list, doctor, recover <committed fixture> --json, a premium tool,
    # library mode, wheel contents and license metadata (tests/test_packaging.py; its fast static
    # checks also run in the selftest job, the installed-mode ones only here)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install build pytest
      - name: Build wheels + installed-mode tests
        env:
          RUST_DEOBF_PACKAGING: "1"
        run: python -m pytest tests/test_packaging.py -v -rs

  benchmark:
    # one job per output format: the build matrix (canary + scatter suites, release and the
    # size/speed fat-LTO profiles) and the emulation-heavy tests are too long for one runner
    strategy:
      fail-fast: false
      matrix:
        format: [elf, pe, elf-arm64, elf-arm64gnu, pe32]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # a binary of this job's format that the tests need but the build did not produce is a
      # FAILURE, not a skip (otherwise a broken build passes CI with every test skipped)
      RUST_DEOBF_REQUIRE_BUILD: ${{ matrix.format }}
      # crates that draw fresh keys per build and cannot be pinned (muddy) are not part of the
      # per-push gate -- their verdict follows the build's key (VALIDATION §77/§78); the weekly
      # scheduled run includes them
      RUST_DEOBF_RANDOM_KEYS: ${{ github.event_name == 'schedule' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: pip install -r requirements.txt pytest

      - name: Rust toolchain (current stable) + targets
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-gnu aarch64-unknown-linux-musl i686-pc-windows-gnu
          rustc --version

      - name: mingw-w64 (PE target linker)
        if: matrix.format == 'pe'
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64

      - name: mingw-w64 i686 (32-bit PE target linker)
        if: matrix.format == 'pe32'
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-i686

      - name: llvm-strip (AArch64)
        if: matrix.format == 'elf-arm64'
        run: sudo apt-get update -q && sudo apt-get install -y -q llvm

      - name: AArch64 glibc cross linker
        if: matrix.format == 'elf-arm64gnu'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      # build_all.sh / build_obf.sh exit non-zero when any binary is missing (cargo's error tail is
      # printed and the full log kept in build/build_logs/), so a broken build fails here
      - name: Build the benchmark for ${{ matrix.format }}
        run: |
          if [ "${{ matrix.format }}" = elf-arm64gnu ]; then
            FORMATS=none ARM64_GNU=1 bash scripts/build_all.sh
          else
            FORMATS=${{ matrix.format }} bash scripts/build_all.sh
          fi

      - name: Recall and precision (canary + scatter suites, library functions, routing, triage)
        run: >-
          python -m pytest -q -rs
          tests/test_benchmark.py tests/test_scatter.py tests/test_libfuncs.py
          tests/test_formats.py::test_detect_64bit_still_emulates tests/test_soc_triage.py

      - name: Obfuscation crates (goldberg et al.)
        if: matrix.format != 'elf-arm64gnu' && matrix.format != 'pe32'
        run: |
          FORMATS=${{ matrix.format }} bash obf_src/build_obf.sh
          python -m pytest tests/test_obf.py -q -rs

      - name: Build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.format }}
          path: build/build_logs/
          if-no-files-found: ignore

  precision:
    # false positives on real, benign binaries of three languages (C/C++, Go, Rust) found on the
    # runner: every decoded string reported there is wrong. The runner image changes under us, so
    # this job reports (a table on the run page) and is marked failed on any FP, without failing
    # the workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Real-binary corpus, whole pipeline
        env:
          RUST_DEOBF_FP_STRICT: "1"
        run: python scripts/measure_fp.py --pipeline --corpus --time-budget 60
