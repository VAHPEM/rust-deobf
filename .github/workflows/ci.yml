name: CI

on:
  push:
  pull_request:
  schedule:
    # weekly: a new stable rustc can change the decoder idioms the recoverers key on
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  selftest:
    # every test that needs no benchmark build: script self-tests, the committed fixtures
    # (Mach-O, lazy string encryption, VM detection/lifting, anti-emulation, deflattening,
    # devirtualization, expression simplification) and the unit tests of the front ends (recover,
    # soc_triage, llm_triage, recover_dynamic, ghidra_annotate, heldout scoring, build scripts).
    # The benchmark-build tests run in the benchmark job; test_32bit/test_formats build i686
    # targets themselves and are not part of this quick job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Unit + fixture tests (no benchmark build needed)
        run: >-
          python -m pytest tests -q -rs
          --ignore=tests/test_benchmark.py --ignore=tests/test_scatter.py
          --ignore=tests/test_obf.py --ignore=tests/test_libfuncs.py
          --ignore=tests/test_32bit.py --ignore=tests/test_formats.py

  native:
    # the same fast subset (`./scripts/check.sh full` -- its ignore list is the one
    # tests/test_docs_current.py keeps equal to the selftest job's) on native hosts other than
    # x86-64 Linux, so the toolkit itself is tested where it runs, not only on ubuntu-latest.
    # No Rust toolchain: nothing here builds the benchmark. Committed benign fixtures only; the
    # one test that executes a sample stays off (RUST_DEOBF_DYNAMIC is not set).
    # windows-11-arm is a canary (continue-on-error): unicorn and capstone<6 ship no win_arm64
    # wheels yet, so it is expected to fail at `pip install`; the day it goes green, they do.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
          - os: windows-latest
          - os: macos-latest        # ARM64
          - os: macos-15-intel      # x86-64
          - os: windows-11-arm
            canary: true
            arch: arm64             # native ARM64 Python, not x64 under emulation (that has wheels)
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.canary == true }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash               # check.sh is bash; Git Bash on the Windows runners
    env:
      PYTHON: python              # check.sh's interpreter; `python3` is not reliable on Windows
    steps:
      # Windows runners default to core.autocrlf=true; with no .gitattributes that checks out
      # check.sh (and the text fixtures) with CRLF and bash dies on `set -o pipefail\r` -- a
      # checkout artifact, not a toolkit result. Check out the bytes as committed.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}   # empty = the runner's native arch
      - name: Interpreter (the canary must be native ARM64 to mean anything)
        run: |
          python -c "import platform, sys; print(sys.version); print(platform.machine())"
          if [ "${{ matrix.canary }}" = "true" ]; then
            python -c "import platform, sys; sys.exit(platform.machine() != 'ARM64')"
          fi
      - run: python -m pip install -r requirements.txt pytest
      - name: Fast subset (check.sh full) on a native host
        run: ./scripts/check.sh full

  packaging:
    # `pip install rust-deobf` must keep working: build both distributions (rust-deobf and
    # rust-deobf-premium), install the wheels into a fresh venv and run them from outside the
    # checkout -- --version, list, doctor, recover <committed fixture> --json, a premium tool,
    # library mode, wheel contents and license metadata (tests/test_packaging.py; its fast static
    # checks also run in the selftest job, the installed-mode ones only here)
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install build pytest
      - name: Build wheels + installed-mode tests
        env:
          RUST_DEOBF_PACKAGING: "1"
        run: python -m pytest tests/test_packaging.py -v -rs

  benchmark:
    # one job per output format: the build matrix (canary + scatter suites, release and the
    # size/speed fat-LTO profiles) and the emulation-heavy tests are too long for one runner
    strategy:
      fail-fast: false
      matrix:
        format: [elf, pe, elf-arm64, elf-arm64gnu, pe32]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # a binary of this job's format that the tests need but the build did not produce is a
      # FAILURE, not a skip (otherwise a broken build passes CI with every test skipped)
      RUST_DEOBF_REQUIRE_BUILD: ${{ matrix.format }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: pip install -r requirements.txt pytest

      - name: Rust toolchain (current stable) + targets
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-gnu aarch64-unknown-linux-musl i686-pc-windows-gnu
          rustc --version

      - name: mingw-w64 (PE target linker)
        if: matrix.format == 'pe'
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64

      - name: mingw-w64 i686 (32-bit PE target linker)
        if: matrix.format == 'pe32'
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-i686

      - name: llvm-strip (AArch64)
        if: matrix.format == 'elf-arm64'
        run: sudo apt-get update -q && sudo apt-get install -y -q llvm

      - name: AArch64 glibc cross linker
        if: matrix.format == 'elf-arm64gnu'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-linux-gnu

      # build_all.sh / build_obf.sh exit non-zero when any binary is missing (cargo's error tail is
      # printed and the full log kept in build/build_logs/), so a broken build fails here
      - name: Build the benchmark for ${{ matrix.format }}
        run: |
          if [ "${{ matrix.format }}" = elf-arm64gnu ]; then
            FORMATS=none ARM64_GNU=1 bash scripts/build_all.sh
          else
            FORMATS=${{ matrix.format }} bash scripts/build_all.sh
          fi

      - name: Recall and precision (canary + scatter suites, library functions, routing, triage)
        run: >-
          python -m pytest -q -rs
          tests/test_benchmark.py tests/test_scatter.py tests/test_libfuncs.py
          tests/test_formats.py::test_detect_64bit_still_emulates tests/test_soc_triage.py

      - name: Obfuscation crates (goldberg et al.)
        if: matrix.format != 'elf-arm64gnu' && matrix.format != 'pe32'
        run: |
          FORMATS=${{ matrix.format }} bash obf_src/build_obf.sh
          python -m pytest tests/test_obf.py -q -rs

      - name: Build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.format }}
          path: build/build_logs/
          if-no-files-found: ignore

  precision:
    # false positives on real, benign binaries of three languages (C/C++, Go, Rust) found on the
    # runner: every decoded string reported there is wrong. The runner image changes under us, so
    # this job reports (a table on the run page) and is marked failed on any FP, without failing
    # the workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Real-binary corpus, whole pipeline
        env:
          RUST_DEOBF_FP_STRICT: "1"
        run: python scripts/measure_fp.py --pipeline --corpus --time-budget 60
